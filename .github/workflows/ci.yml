name: AERO CI Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Linux — Edge Server + Linux Client CLI
  # ──────────────────────────────────────────────────────────────────────────
  build-server:
    name: Linux Build & Test (Edge Server + Client)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Vet & Test Edge & Mid
        run: |
          go vet ./aeroprot/internal/edge ./aeroprot/cmd/edge ./aerosub/internal/mid ./aerosub/cmd/mid
          go test -race -shuffle=on -v ./aeroprot/internal/edge ./aerosub/internal/mid

      - name: Build Edge Server (linux/amd64 & linux/arm64)
        run: |
          mkdir -p dist/server
          GOOS=linux GOARCH=amd64 go build -v \
            -ldflags="-s -w" \
            -o dist/server/aerosys-server-linux-amd64 ./aeroprot/cmd/edge
          GOOS=linux GOARCH=arm64 go build -v \
            -ldflags="-s -w" \
            -o dist/server/aerosys-server-linux-arm64 ./aeroprot/cmd/edge

      - name: Build Midplatform Control Plane (linux/amd64)
        run: |
          GOOS=linux GOARCH=amd64 go build -v \
            -ldflags="-s -w" \
            -o dist/server/aerosys-mid-linux-amd64 ./aerosub/cmd/mid

      - name: Build Linux Client CLI (linux/amd64 & linux/arm64)
        run: |
          GOOS=linux GOARCH=amd64 go build -v \
            -ldflags="-s -w" \
            -o dist/server/aerosys-cli-linux-amd64 ./aeroprot/cmd/client
          GOOS=linux GOARCH=arm64 go build -v \
            -ldflags="-s -w" \
            -o dist/server/aerosys-cli-linux-arm64 ./aeroprot/cmd/client

      - name: Upload Server & Linux Client Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-server-linux
          path: dist/server/*

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Windows — Client GUI + Watchdog Guard + Desk
  # ──────────────────────────────────────────────────────────────────────────
  build-client-windows:
    name: Windows Build & Test (Client GUI + Guard + Desk)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Vet & Test Client & Desk
        run: |
          go vet ./aeroprot/internal/client ./aeroprot/cmd/client ./aeroprot/cmd/guard ./aeroos/internal/desk ./aeroos/cmd/desk
          go test -v -short -shuffle=on ./aeroprot/internal/client ./aeroos/internal/desk

      - name: Build Windows Client & Desk
        run: |
          mkdir -p dist/client-windows
          go build -v -ldflags="-s -w" -o dist/client-windows/aerosys-client-windows-amd64.exe ./aeroprot/cmd/client
          go build -v -ldflags="-s -w" -o dist/client-windows/aerosys-guard-windows-amd64.exe ./aeroprot/cmd/guard
          go build -v -ldflags="-s -w" -o dist/client-windows/aerosys-desk-windows-amd64.exe ./aeroos/cmd/desk
          curl.exe -fsSL "https://www.wintun.net/builds/wintun-0.14.1.zip" -o wintun.zip
          tar.exe -xf wintun.zip
          Copy-Item wintun/bin/amd64/wintun.dll dist/client-windows/wintun.dll

      - name: Upload Windows Client Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-client-windows
          path: dist/client-windows/*

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: macOS — Client & Desk (arm64 & amd64)
  # ──────────────────────────────────────────────────────────────────────────
  build-client-macos:
    name: macOS Build & Test (Client & Desk)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Vet Client & Desk
        run: |
          go vet ./aeroprot/internal/client ./aeroprot/cmd/client ./aeroos/internal/desk ./aeroos/cmd/desk

      - name: Build Client (mac arm64 & amd64)
        run: |
          mkdir -p dist/client-macos
          GOOS=darwin GOARCH=arm64 go build -v -ldflags="-s -w" -o dist/client-macos/aerosys-client-mac-arm64 ./aeroprot/cmd/client
          GOOS=darwin GOARCH=amd64 go build -v -ldflags="-s -w" -o dist/client-macos/aerosys-client-mac-amd64 ./aeroprot/cmd/client
          GOOS=darwin GOARCH=arm64 go build -v -ldflags="-s -w" -o dist/client-macos/aerosys-desk-mac-arm64 ./aeroos/cmd/desk
          GOOS=darwin GOARCH=amd64 go build -v -ldflags="-s -w" -o dist/client-macos/aerosys-desk-mac-amd64 ./aeroos/cmd/desk

      - name: Upload macOS Client Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-client-macos
          path: dist/client-macos/*

  # ──────────────────────────────────────────────────────────────────────────
  # Job 4: Publish Multi-Platform Release (on main)
  # ──────────────────────────────────────────────────────────────────────────
  publish-release:
    name: Publish Official Multi-Platform GitHub Release
    if: github.ref == 'refs/heads/main' && always() && !cancelled() && needs.build-server.result == 'success' && needs.build-client-windows.result == 'success' && needs.build-client-macos.result == 'success'
    needs:
      - build-server
      - build-client-windows
      - build-client-macos
    runs-on: ubuntu-latest
    steps:
      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: Flatten and List Release Assets
        run: |
          mkdir -p release-dist
          find release-assets/ -type f -exec cp -f {} release-dist/ \;
          ls -lh release-dist/

      - name: Publish All Multi-Platform Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "AEROSYS v1.0.0 Official Release"
          draft: false
          prerelease: false
          make_latest: true
          files: release-dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
