name: AERO CI Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Linux — Proto + Edge Server + aero-panel + Linux Client CLI
  # ──────────────────────────────────────────────────────────────────────────
  build-server:
    name: Linux Build & Test (Proto + Edge Server + Panel + Client)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Vet & Test Proto and Edge
        run: |
          go vet ./internal/proto ./internal/edge ./cmd/edge ./cmd/panel
          go test -race -shuffle=on -v ./internal/proto ./internal/edge

      - name: Build Edge Server (linux/amd64 & linux/arm64)
        run: |
          mkdir -p dist/server
          GOOS=linux GOARCH=amd64 go build -v \
            -ldflags="-s -w" \
            -o dist/server/aerosys-server-linux-amd64 ./cmd/edge
          GOOS=linux GOARCH=arm64 go build -v \
            -ldflags="-s -w" \
            -o dist/server/aerosys-server-linux-arm64 ./cmd/edge

      - name: Build Standalone VPS Panel (aerosys-panel)
        run: |
          GOOS=linux GOARCH=amd64 go build -v \
            -ldflags="-s -w" \
            -o dist/server/aerosys-panel-linux-amd64 ./cmd/panel

      - name: Build Linux Client CLI (linux/amd64 & linux/arm64)
        run: |
          GOOS=linux GOARCH=amd64 go build -v \
            -ldflags="-s -w" \
            -o dist/server/aerosys-cli-linux-amd64 ./cmd/client
          GOOS=linux GOARCH=arm64 go build -v \
            -ldflags="-s -w" \
            -o dist/server/aerosys-cli-linux-arm64 ./cmd/client

      - name: Upload Server & Linux Client Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-server-linux
          path: dist/server/*

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Windows — Client GUI + Watchdog Guard
  # ──────────────────────────────────────────────────────────────────────────
  build-client-windows:
    name: Windows Build & Test (Client GUI + Guard)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Vet & Test Client
        run: |
          go vet ./internal/client ./cmd/client ./cmd/guard
          go test -v -short -shuffle=on ./internal/client

      - name: Build Client (windows/amd64)
        run: |
          mkdir -p dist/client-windows
          go build -v -ldflags="-s -w" -o dist/client-windows/aerosys-client-windows-amd64.exe ./cmd/client
          go build -v -ldflags="-s -w" -o dist/client-windows/aerosys-guard-windows-amd64.exe ./cmd/guard

      - name: Upload Windows Client Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-client-windows
          path: dist/client-windows/*

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: macOS — Client (arm64 & amd64)
  # ──────────────────────────────────────────────────────────────────────────
  build-client-macos:
    name: macOS Build & Test (Client)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Vet Client
        run: |
          go vet ./internal/client ./cmd/client

      - name: Build Client (mac arm64 & amd64)
        run: |
          mkdir -p dist/client-macos
          GOOS=darwin GOARCH=arm64 go build -v -ldflags="-s -w" -o dist/client-macos/aerosys-client-mac-arm64 ./cmd/client
          GOOS=darwin GOARCH=amd64 go build -v -ldflags="-s -w" -o dist/client-macos/aerosys-client-mac-amd64 ./cmd/client

      - name: Upload macOS Client Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-client-macos
          path: dist/client-macos/*

  # ──────────────────────────────────────────────────────────────────────────
  # Job 4: Publish Multi-Platform Release (on main)
  # ──────────────────────────────────────────────────────────────────────────
  publish-release:
    name: Publish Official Multi-Platform GitHub Release
    if: github.ref == 'refs/heads/main' && always() && !cancelled() && needs.build-server.result == 'success' && needs.build-client-windows.result == 'success' && needs.build-client-macos.result == 'success'
    needs:
      - build-server
      - build-client-windows
      - build-client-macos
    runs-on: ubuntu-latest
    steps:
      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: Flatten and List Release Assets
        run: |
          mkdir -p release-dist
          find release-assets/ -type f -exec cp -f {} release-dist/ \;
          ls -lh release-dist/

      - name: Publish All Multi-Platform Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "AEROSYS v1.0.0 Official Release"
          draft: false
          prerelease: false
          make_latest: true
          files: release-dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
