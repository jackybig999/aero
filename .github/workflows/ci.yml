name: AERO CI Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Linux — Edge Server + Midplatform + Linux/Android Client
  # ──────────────────────────────────────────────────────────────────────────
  build-server:
    name: Linux Build & Test (Edge Server + Mid + Client)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Format Gate (L0 §15.1)
        run: test -z "$(gofmt -l cmd internal tools)" || { gofmt -l cmd internal tools; exit 1; }

      - name: Component Isolation Gate (ADR-0009)
        run: bash tools/check-imports.sh

      - name: Version Consistency Gate
        run: bash tools/check-version.sh

      - name: Vet & Test Edge, Sub & Client
        run: |
          go vet ./internal/edge ./cmd/edge ./internal/sub ./cmd/sub ./internal/client ./cmd/client
          go test -race -shuffle=on -v ./internal/edge ./internal/sub ./internal/client

      - name: Build Edge Server (linux/amd64 & linux/arm64)
        run: |
          mkdir -p dist/server
          GOOS=linux GOARCH=amd64 go build -v \
            -ldflags="-s -w" \
            -o dist/server/edge_linux_amd64 ./cmd/edge
          GOOS=linux GOARCH=arm64 go build -v \
            -ldflags="-s -w" \
            -o dist/server/edge_linux_arm64 ./cmd/edge

      - name: Build Midplatform Control Plane (linux/amd64 & linux/arm64)
        run: |
          GOOS=linux GOARCH=amd64 go build -v \
            -ldflags="-s -w" \
            -o dist/server/mid_linux_amd64 ./cmd/sub
          GOOS=linux GOARCH=arm64 go build -v \
            -ldflags="-s -w" \
            -o dist/server/mid_linux_arm64 ./cmd/sub

      - name: Build Linux Client CLI (linux/amd64 & linux/arm64)
        run: |
          GOOS=linux GOARCH=amd64 go build -v \
            -ldflags="-s -w" \
            -o dist/server/aeroprot_linux_amd64 ./cmd/client
          GOOS=linux GOARCH=arm64 go build -v \
            -ldflags="-s -w" \
            -o dist/server/aeroprot_linux_arm64 ./cmd/client

      - name: Build Android Client (arm64 & amd64)
        run: |
          GOOS=android GOARCH=arm64 go build -v \
            -ldflags="-s -w" \
            -o dist/server/aeroprot_android_arm64 ./cmd/client

          NDK_CLANG=$(find /usr/local/lib/android/sdk/ndk/ "$ANDROID_HOME/ndk" -name "x86_64-linux-android*-clang" 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$NDK_CLANG" ] && [ -x "$NDK_CLANG" ]; then
            CGO_ENABLED=1 CC="$NDK_CLANG" GOOS=android GOARCH=amd64 go build -v \
              -ldflags="-s -w" \
              -o dist/server/aeroprot_android_amd64 ./cmd/client
          else
            GOOS=android GOARCH=amd64 go build -v \
              -ldflags="-s -w" \
              -o dist/server/aeroprot_android_amd64 ./cmd/client || true
          fi

      - name: Upload Server & Linux/Android Client Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-server-linux
          path: dist/server/*

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Windows — Client GUI + Desk
  # ──────────────────────────────────────────────────────────────────────────
  build-client-windows:
    name: Windows Build & Test (Client GUI + Desk)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Vet & Test Client & Desk
        run: |
          go vet ./internal/client ./cmd/client ./internal/desk ./cmd/desk
          go test -v -short -shuffle=on ./internal/client ./internal/desk

      - name: Build Windows Client & Desk
        run: |
          mkdir -p dist/client-windows
          mkdir -p dist/aeroprot-win-bundle
          go build -v -ldflags="-H windowsgui -s -w" -o dist/aeroprot-win-bundle/aeroprot.exe ./cmd/client
          curl.exe -fsSL "https://www.wintun.net/builds/wintun-0.14.1.zip" -o wintun.zip
          tar.exe -xf wintun.zip
          Copy-Item wintun/bin/amd64/wintun.dll dist/aeroprot-win-bundle/wintun.dll
          Compress-Archive -Path dist/aeroprot-win-bundle/* -DestinationPath dist/client-windows/aeroprot_win_amd64.zip
          go build -v -ldflags="-H windowsgui -s -w" -o dist/client-windows/aeroos_win_amd64.exe ./cmd/desk

      - name: Upload Windows Client Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-client-windows
          path: dist/client-windows/*

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: macOS & iOS — Client & Desk (arm64 & amd64)
  # ──────────────────────────────────────────────────────────────────────────
  build-client-macos:
    name: macOS & iOS Build & Test (Client & Desk)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Vet Client & Desk
        run: |
          go vet ./internal/client ./cmd/client ./internal/desk ./cmd/desk

      - name: Build macOS Client & Desk
        run: |
          mkdir -p dist/client-macos
          GOOS=darwin GOARCH=arm64 go build -v -ldflags="-s -w" -o dist/client-macos/aeroprot_mac_arm64 ./cmd/client
          GOOS=darwin GOARCH=amd64 go build -v -ldflags="-s -w" -o dist/client-macos/aeroprot_mac_amd64 ./cmd/client
          GOOS=darwin GOARCH=arm64 go build -v -ldflags="-s -w" -o dist/client-macos/aeroos_mac_arm64 ./cmd/desk
          GOOS=darwin GOARCH=amd64 go build -v -ldflags="-s -w" -o dist/client-macos/aeroos_mac_amd64 ./cmd/desk

      - name: Build iOS Client (arm64)
        run: |
          SDKPATH=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null || true)
          if [ -n "$SDKPATH" ]; then
            CGO_ENABLED=1 CC="$(xcrun --sdk iphoneos --find clang) -isysroot $SDKPATH -target arm64-apple-ios14.0" GOOS=ios GOARCH=arm64 go build -v -ldflags="-s -w" -o dist/client-macos/aeroprot_ios_arm64 ./cmd/client
          else
            GOOS=ios GOARCH=arm64 go build -v -ldflags="-s -w" -o dist/client-macos/aeroprot_ios_arm64 ./cmd/client || true
          fi

      - name: Upload macOS & iOS Client Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-client-macos
          path: dist/client-macos/*

  # ──────────────────────────────────────────────────────────────────────────
  # Job 4: Publish Multi-Platform Release (on main)
  # ──────────────────────────────────────────────────────────────────────────
  publish-release:
    name: Publish Official Multi-Platform GitHub Release
    if: github.ref == 'refs/heads/main' && always() && !cancelled() && needs.build-server.result == 'success' && needs.build-client-windows.result == 'success' && needs.build-client-macos.result == 'success'
    needs:
      - build-server
      - build-client-windows
      - build-client-macos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: Flatten and List Release Assets
        run: |
          mkdir -p release-dist
          find release-assets/ -type f -exec cp -f {} release-dist/ \;
          ls -lh release-dist/

      - name: Resolve Release Tag and Version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(cat VERSION 2>/dev/null || echo "1.0.0")
          VER=$(echo "$VER" | tr -d '[:space:]' | sed 's/^v//')
          echo "RELEASE_VER=$VER" >> $GITHUB_ENV
          echo "RELEASE_TAG=v$VER" >> $GITHUB_ENV
          # 已发布的版本不可改写：资产一旦发布即被部署与校验，重新构建会改变哈希。要发布新产物必须先升 VERSION。
          if gh api "repos/${{ github.repository }}/releases/tags/v$VER" >/dev/null 2>&1; then
            echo "RELEASE_EXISTS=1" >> $GITHUB_ENV
            echo "Release v$VER already exists; not republishing. Bump VERSION to publish." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Generate SHA256SUMS
        if: env.RELEASE_EXISTS != '1'
        run: |
          cd release-dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      - name: Publish All Multi-Platform Assets to GitHub Release
        if: env.RELEASE_EXISTS != '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_VER }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          make_latest: true
          files: release-dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
