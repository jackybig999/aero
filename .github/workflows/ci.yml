name: AERO CI Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Linux — Edge Server + Linux Client CLI
  # ──────────────────────────────────────────────────────────────────────────
  build-server:
    name: Linux Build & Test (Edge Server + Client)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Vet & Test Edge & Mid
        run: |
          go vet ./aeroprot/internal/edge ./aeroprot/cmd/edge ./aerosub/internal/mid ./aerosub/cmd/mid
          go test -race -shuffle=on -v ./aeroprot/internal/edge ./aerosub/internal/mid

      - name: Build Edge Server (linux/amd64 & linux/arm64)
        run: |
          mkdir -p dist/server
          GOOS=linux GOARCH=amd64 go build -v \
            -ldflags="-s -w" \
            -o dist/server/aeroprot-edge-linux-amd64 ./aeroprot/cmd/edge
          GOOS=linux GOARCH=arm64 go build -v \
            -ldflags="-s -w" \
            -o dist/server/aeroprot-edge-linux-arm64 ./aeroprot/cmd/edge

      - name: Build Midplatform Control Plane (linux/amd64)
        run: |
          GOOS=linux GOARCH=amd64 go build -v \
            -ldflags="-s -w" \
            -o dist/server/aerosub-mid-linux-amd64 ./aerosub/cmd/mid

      - name: Build Linux Client CLI (linux/amd64 & linux/arm64)
        run: |
          GOOS=linux GOARCH=amd64 go build -v \
            -ldflags="-s -w" \
            -o dist/server/aeroprot-cli-linux-amd64 ./aeroprot/cmd/client
          GOOS=linux GOARCH=arm64 go build -v \
            -ldflags="-s -w" \
            -o dist/server/aeroprot-cli-linux-arm64 ./aeroprot/cmd/client

      - name: Upload Server & Linux Client Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-server-linux
          path: dist/server/*

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Windows — Client GUI + Watchdog Guard + Desk
  # ──────────────────────────────────────────────────────────────────────────
  build-client-windows:
    name: Windows Build & Test (Client GUI + Guard + Desk)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Vet & Test Client & Desk
        run: |
          go vet ./aeroprot/internal/client ./aeroprot/cmd/client ./aeroprot/cmd/guard ./aeroos/internal/desk ./aeroos/cmd/desk
          go test -v -short -shuffle=on ./aeroprot/internal/client ./aeroos/internal/desk

      - name: Build Windows Client & Desk
        run: |
          mkdir -p dist/client-windows
          mkdir -p dist/aeroprot-win-bundle
          go build -v -ldflags="-s -w" -o dist/aeroprot-win-bundle/aeroprot-client.exe ./aeroprot/cmd/client
          go build -v -ldflags="-s -w" -o dist/aeroprot-win-bundle/aeroprot-guard.exe ./aeroprot/cmd/guard
          curl.exe -fsSL "https://www.wintun.net/builds/wintun-0.14.1.zip" -o wintun.zip
          tar.exe -xf wintun.zip
          Copy-Item wintun/bin/amd64/wintun.dll dist/aeroprot-win-bundle/wintun.dll
          Compress-Archive -Path dist/aeroprot-win-bundle/* -DestinationPath dist/client-windows/aeroprot-client-windows-amd64.zip
          go build -v -ldflags="-s -w" -o dist/client-windows/aeroos-desk-windows-amd64.exe ./aeroos/cmd/desk

      - name: Upload Windows Client Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-client-windows
          path: dist/client-windows/*

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: macOS — Client & Desk (arm64 & amd64)
  # ──────────────────────────────────────────────────────────────────────────
  build-client-macos:
    name: macOS Build & Test (Client & Desk)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Vet Client & Desk
        run: |
          go vet ./aeroprot/internal/client ./aeroprot/cmd/client ./aeroos/internal/desk ./aeroos/cmd/desk

      - name: Build Client (mac arm64 & amd64)
        run: |
          mkdir -p dist/client-macos
          GOOS=darwin GOARCH=arm64 go build -v -ldflags="-s -w" -o dist/client-macos/aeroprot-client-darwin-arm64 ./aeroprot/cmd/client
          GOOS=darwin GOARCH=amd64 go build -v -ldflags="-s -w" -o dist/client-macos/aeroprot-client-darwin-amd64 ./aeroprot/cmd/client
          GOOS=darwin GOARCH=arm64 go build -v -ldflags="-s -w" -o dist/client-macos/aeroos-desk-darwin-arm64 ./aeroos/cmd/desk
          GOOS=darwin GOARCH=amd64 go build -v -ldflags="-s -w" -o dist/client-macos/aeroos-desk-darwin-amd64 ./aeroos/cmd/desk

      - name: Upload macOS Client Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-client-macos
          path: dist/client-macos/*

  # ──────────────────────────────────────────────────────────────────────────
  # Job 4: Publish Multi-Platform Release (on main)
  # ──────────────────────────────────────────────────────────────────────────
  publish-release:
    name: Publish Official Multi-Platform GitHub Release
    if: github.ref == 'refs/heads/main' && always() && !cancelled() && needs.build-server.result == 'success' && needs.build-client-windows.result == 'success' && needs.build-client-macos.result == 'success'
    needs:
      - build-server
      - build-client-windows
      - build-client-macos
    runs-on: ubuntu-latest
    steps:
      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: Flatten and List Release Assets
        run: |
          mkdir -p release-dist
          find release-assets/ -type f -exec cp -f {} release-dist/ \;
          ls -lh release-dist/

      - name: Prune Stale Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Auditing GitHub Release v1.0.0 Assets ==="
          EXISTING_ASSETS=$(gh api repos/${{ github.repository }}/releases/tags/v1.0.0 --jq '.assets[] | "\(.id) \(.name)"' 2>/dev/null || true)
          if [ -n "$EXISTING_ASSETS" ]; then
            while read -r asset_id asset_name; do
              if [ -n "$asset_id" ] && [ -n "$asset_name" ]; then
                if [ ! -f "release-dist/$asset_name" ]; then
                  echo "[PRUNE] Removing obsolete release asset: $asset_name (id: $asset_id)"
                  gh api --method DELETE "repos/${{ github.repository }}/releases/assets/$asset_id" || true
                else
                  echo "[KEEP] Current valid release asset: $asset_name"
                fi
              fi
            done <<< "$EXISTING_ASSETS"
          fi

      - name: Publish All Multi-Platform Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "AERO v1.0.0 Official Release"
          draft: false
          prerelease: false
          make_latest: true
          files: release-dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
