name: AERO CI Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Linux — Edge Server + Midplatform + Linux/Android Client
  # ──────────────────────────────────────────────────────────────────────────
  build-server:
    name: Linux Build & Test (Edge Server + Mid + Client)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Vet & Test Edge & Mid
        run: |
          go vet ./aeroprot/internal/edge ./aeroprot/cmd/edge ./aerosub/internal/mid ./aerosub/cmd/mid
          go test -race -shuffle=on -v ./aeroprot/internal/edge ./aerosub/internal/mid

      - name: Build Edge Server (linux/amd64 & linux/arm64)
        run: |
          mkdir -p dist/server
          GOOS=linux GOARCH=amd64 go build -v \
            -ldflags="-s -w" \
            -o dist/server/edge_linux_amd64 ./aeroprot/cmd/edge
          GOOS=linux GOARCH=arm64 go build -v \
            -ldflags="-s -w" \
            -o dist/server/edge_linux_arm64 ./aeroprot/cmd/edge

      - name: Build Midplatform Control Plane (linux/amd64 & linux/arm64)
        run: |
          GOOS=linux GOARCH=amd64 go build -v \
            -ldflags="-s -w" \
            -o dist/server/mid_linux_amd64 ./aerosub/cmd/mid
          GOOS=linux GOARCH=arm64 go build -v \
            -ldflags="-s -w" \
            -o dist/server/mid_linux_arm64 ./aerosub/cmd/mid

      - name: Build Linux Client CLI (linux/amd64 & linux/arm64)
        run: |
          GOOS=linux GOARCH=amd64 go build -v \
            -ldflags="-s -w" \
            -o dist/server/aeroprot_linux_amd64 ./aeroprot/cmd/client
          GOOS=linux GOARCH=arm64 go build -v \
            -ldflags="-s -w" \
            -o dist/server/aeroprot_linux_arm64 ./aeroprot/cmd/client

      - name: Build Android Client (arm64 & amd64)
        run: |
          GOOS=android GOARCH=arm64 go build -v \
            -ldflags="-s -w" \
            -o dist/server/aeroprot_android_arm64 ./aeroprot/cmd/client

          NDK_CLANG=$(find /usr/local/lib/android/sdk/ndk/ "$ANDROID_HOME/ndk" -name "x86_64-linux-android*-clang" 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$NDK_CLANG" ] && [ -x "$NDK_CLANG" ]; then
            CGO_ENABLED=1 CC="$NDK_CLANG" GOOS=android GOARCH=amd64 go build -v \
              -ldflags="-s -w" \
              -o dist/server/aeroprot_android_amd64 ./aeroprot/cmd/client
          else
            GOOS=android GOARCH=amd64 go build -v \
              -ldflags="-s -w" \
              -o dist/server/aeroprot_android_amd64 ./aeroprot/cmd/client || true
          fi

      - name: Upload Server & Linux/Android Client Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-server-linux
          path: dist/server/*

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Windows — Client GUI + Watchdog Guard + Desk
  # ──────────────────────────────────────────────────────────────────────────
  build-client-windows:
    name: Windows Build & Test (Client GUI + Guard + Desk)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Vet & Test Client & Desk
        run: |
          go vet ./aeroprot/internal/client ./aeroprot/cmd/client ./aeroprot/cmd/guard ./aeroos/internal/desk ./aeroos/cmd/desk
          go test -v -short -shuffle=on ./aeroprot/internal/client ./aeroos/internal/desk

      - name: Build Windows Client & Desk
        run: |
          mkdir -p dist/client-windows
          mkdir -p dist/aeroprot-win-bundle
          go build -v -ldflags="-H windowsgui -s -w" -o dist/aeroprot-win-bundle/aeroprot.exe ./aeroprot/cmd/client
          go build -v -ldflags="-s -w" -o dist/aeroprot-win-bundle/guard.exe ./aeroprot/cmd/guard
          curl.exe -fsSL "https://www.wintun.net/builds/wintun-0.14.1.zip" -o wintun.zip
          tar.exe -xf wintun.zip
          Copy-Item wintun/bin/amd64/wintun.dll dist/aeroprot-win-bundle/wintun.dll
          Compress-Archive -Path dist/aeroprot-win-bundle/* -DestinationPath dist/client-windows/aeroprot_win_amd64.zip
          go build -v -ldflags="-H windowsgui -s -w" -o dist/client-windows/aeroos_win_amd64.exe ./aeroos/cmd/desk

      - name: Upload Windows Client Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-client-windows
          path: dist/client-windows/*

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: macOS & iOS — Client & Desk (arm64 & amd64)
  # ──────────────────────────────────────────────────────────────────────────
  build-client-macos:
    name: macOS & iOS Build & Test (Client & Desk)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Vet Client & Desk
        run: |
          go vet ./aeroprot/internal/client ./aeroprot/cmd/client ./aeroos/internal/desk ./aeroos/cmd/desk

      - name: Build macOS Client & Desk
        run: |
          mkdir -p dist/client-macos
          GOOS=darwin GOARCH=arm64 go build -v -ldflags="-s -w" -o dist/client-macos/aeroprot_mac_arm64 ./aeroprot/cmd/client
          GOOS=darwin GOARCH=amd64 go build -v -ldflags="-s -w" -o dist/client-macos/aeroprot_mac_amd64 ./aeroprot/cmd/client
          GOOS=darwin GOARCH=arm64 go build -v -ldflags="-s -w" -o dist/client-macos/aeroos_mac_arm64 ./aeroos/cmd/desk
          GOOS=darwin GOARCH=amd64 go build -v -ldflags="-s -w" -o dist/client-macos/aeroos_mac_amd64 ./aeroos/cmd/desk

      - name: Build iOS Client (arm64)
        run: |
          SDKPATH=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null || true)
          if [ -n "$SDKPATH" ]; then
            CGO_ENABLED=1 CC="$(xcrun --sdk iphoneos --find clang) -isysroot $SDKPATH -target arm64-apple-ios14.0" GOOS=ios GOARCH=arm64 go build -v -ldflags="-s -w" -o dist/client-macos/aeroprot_ios_arm64 ./aeroprot/cmd/client
          else
            GOOS=ios GOARCH=arm64 go build -v -ldflags="-s -w" -o dist/client-macos/aeroprot_ios_arm64 ./aeroprot/cmd/client || true
          fi

      - name: Upload macOS & iOS Client Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-client-macos
          path: dist/client-macos/*

  # ──────────────────────────────────────────────────────────────────────────
  # Job 4: Publish Multi-Platform Release (on main)
  # ──────────────────────────────────────────────────────────────────────────
  publish-release:
    name: Publish Official Multi-Platform GitHub Release
    if: github.ref == 'refs/heads/main' && always() && !cancelled() && needs.build-server.result == 'success' && needs.build-client-windows.result == 'success' && needs.build-client-macos.result == 'success'
    needs:
      - build-server
      - build-client-windows
      - build-client-macos
    runs-on: ubuntu-latest
    steps:
      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: Flatten and List Release Assets
        run: |
          mkdir -p release-dist
          find release-assets/ -type f -exec cp -f {} release-dist/ \;
          ls -lh release-dist/

      - name: Resolve Release Tag and Version
        run: |
          VER=$(cat VERSION 2>/dev/null || echo "1.0.6")
          VER=$(echo "$VER" | tr -d '[:space:]' | sed 's/^v//')
          echo "RELEASE_VER=$VER" >> $GITHUB_ENV
          echo "RELEASE_TAG=v$VER" >> $GITHUB_ENV

      - name: Prune Stale Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Auditing GitHub Release $RELEASE_TAG Assets ==="
          EXISTING_ASSETS=$(gh api repos/${{ github.repository }}/releases/tags/$RELEASE_TAG --jq '.assets[] | "\(.id) \(.name)"' 2>/dev/null || true)
          if [ -n "$EXISTING_ASSETS" ]; then
            while read -r asset_id asset_name; do
              if [ -n "$asset_id" ] && [ -n "$asset_name" ]; then
                if [ ! -f "release-dist/$asset_name" ]; then
                  echo "[PRUNE] Removing obsolete release asset: $asset_name (id: $asset_id)"
                  gh api --method DELETE "repos/${{ github.repository }}/releases/assets/$asset_id" || true
                else
                  echo "[KEEP] Current valid release asset: $asset_name"
                fi
              fi
            done <<< "$EXISTING_ASSETS"
          fi

      - name: Publish All Multi-Platform Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_VER }}
          body: |
            ### 核心技术更新 (Release Highlights)
            - **权威线缆契约与零空值零遗漏防线**：跨系统全面落地 Wire-Contract 测试与归一化流水线，强输入校验与未知字段拦截，彻底消除空值漂移与字段丢弃。
            - **生产级单写者架构与资源回收无锁化**：单机 Pure-Go SQLite 数据库固化单写者连接池（SetMaxOpenConns(1)），无锁回收空闲上下文，彻底消除并发死锁与锁库崩溃。
            - **零本地宿主订阅与标准 443 协议发布死线**：中台严格定位为管理控制台，全系统绝对严禁输出任何本地宿主带端口订阅，统一经由公网合法 SSL 证书的标准 443 HTTPS 域名发布；双向探活对齐与 Windows NRPT 自动自愈。
          draft: false
          prerelease: false
          make_latest: true
          files: release-dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
