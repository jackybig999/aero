# AERO Protocol Server Configuration
# 统一服务端配置文件

aero:
  version: "2.0"
  server:
    listen:
      ports: [443]
      plain_ports: [80]

    auth:
      tokens:
        - token: "your-bootstrap-token-here"
          name: "default-admin"
          level: "admin"

    ech:
      public_name: "cdn-aero.com"

    tls:
      cert_file: "/var/lib/aero/tls/fullchain.pem"
      key_file: "/var/lib/aero/tls/privkey.pem"
      autocert:
        domain: ""
        email: "admin@example.com"
        cache_dir: "/var/lib/aero/certs"

    limits:
      profile: "small"        # tiny | small | medium | large
      max_conn: 0             # 0 = use profile default
      max_conn_user: 0
      rate_ip: 0
      bw_user: -1             # -1 = profile default, 0 = unlimited

    log:
      format: "text"          # text | json
      file: "/var/log/aero-edge.log"
