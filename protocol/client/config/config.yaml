# AERO Protocol v1.0 — Client Configuration
# 所有字段内嵌 AERO 语义，不存在 outbounds 等多协议概念

aero:
  version: "1.0"

client:
  log:
    file: ""                    # 空 = stderr
    format: text                # text | json

  listen:
    socks5: "127.0.0.1:55555"  # 混合口 HTTP+SOCKS5（可用 -listen 覆盖）

  tun:                          # AERO 系统级入口
    enabled: false              # 启用后替代 SOCKS5
    device: "aero0"
    mtu: 1420
    ipv4: "10.88.0.2/24"
    ipv6: "fd00:aero::2/64"
    routes:
      - "0.0.0.0/0"
      - "::/0"
    dns:
      servers:
        - "223.5.5.5"
        - "8.8.8.8"
      hijack: true
      fake_ip:
        enabled: true
        range: "198.18.0.0/15"

  edge:
    pool:
      - name: "tokyo-1"
        address: "tk.aero.example.com:443"
        token: "your-token-here"
        sni: "cdn-aero.com"
        weight: 100
        tags: ["premium"]
    selection:
      strategy: rtt             # rtt | least_fail | weighted | manual
      probe_interval: 30s
      cooldown: 30s
    transport:
      fingerprint: chrome       # chrome | firefox | safari | random
      ech:
        enabled: true
        config_b64: ""

  split:
    enabled: true
    default: proxy              # direct | proxy | ai
    rules:
      - name: "ai-direct"
        strategy: ai
        domain_suffixes: ["openai.com", "anthropic.com", "deepseek.com"]
      - name: "china-direct"
        strategy: direct
        domain_suffixes: ["taobao.com", "jd.com"]

  qos:
    heartbeat_interval: 30s
    heartbeat_timeout: 90s
    ai:
      sse_keepalive: 15s
      first_token_timeout: 60s
      context_ttl: 5m
