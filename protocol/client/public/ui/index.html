<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c111c" />
    <title>AERO</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header>
        <div class="brand">
          <span class="logo">A</span>
          <div>
            <h1>AERO</h1>
            <p class="hint" data-i18n="tagline">本地口已开</p>
          </div>
        </div>
        <div class="lang-wrap">
          <button type="button" id="btnLang" class="lang-btn">简</button>
          <div id="langMenu" class="lang-menu" hidden>
            <button type="button" data-lang="zh-CN">简体中文</button>
            <button type="button" data-lang="zh-TW">繁體中文</button>
            <button type="button" data-lang="en">English</button>
          </div>
        </div>
      </header>

      <!-- 核心控制区：精巧 76px 状态呼吸旋钮 -->
      <div class="power-wrap">
        <button type="button" id="btnPower" class="power" aria-label="connect">
          <svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true">
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
              d="M12 3.5v8.2M8.1 6.2a7 7 0 1 0 7.8 0"
            />
          </svg>
        </button>
        <div id="stState" class="pill off" data-i18n="ready">就绪</div>
      </div>

      <!-- 常驻端口徽章：专供指纹浏览器/应用一键复制使用 -->
      <button type="button" id="btnDesktop" class="desktop">
        <span data-i18n="desktop">指纹浏览器专线</span>
        <b>127.0.0.1:55555</b>
        <span class="copy" data-i18n="copy">复制</span>
      </button>

      <!-- 订阅与账号中心：双通道切换 (专属订阅 / 中台账号登录) -->
      <section class="card" id="authCard">
        <div class="tab-hd">
          <button type="button" class="tab-btn active" id="tabSubManual">专属订阅链接</button>
          <button type="button" class="tab-btn" id="tabAuthLogin">中台账号登录</button>
        </div>

        <!-- 通道 1: 专属订阅链接输入 -->
        <div id="paneSubManual" class="tab-pane">
          <textarea id="subUrl" rows="2" spellcheck="false" placeholder="粘贴专属订阅链接 (https://.../sub/...)"></textarea>
          <div class="row" style="margin-top:6px">
            <button type="button" id="btnPaste" class="ghost" data-i18n="paste">📋 粘贴</button>
            <button type="button" id="btnScan" class="ghost" data-i18n="scan">📷 扫码</button>
            <button type="button" id="btnApplyManualSub" class="ghost" style="color:var(--blue);margin-left:auto">载入</button>
          </div>
        </div>

        <!-- 通道 2: 中台账号登录表单 -->
        <div id="paneAuthLogin" class="tab-pane" style="display:none">
          <div id="loginFormWrap">
            <div class="input-row">
              <span class="input-icon">🌐</span>
              <input type="text" id="loginServer" placeholder="中台地址 (如 https://myconsun.de5.net)" />
            </div>
            <div class="input-row">
              <span class="input-icon">👤</span>
              <input type="text" id="loginUsername" placeholder="中台用户名" />
            </div>
            <div class="input-row">
              <span class="input-icon">🔒</span>
              <input type="password" id="loginPassword" placeholder="登录密码" />
            </div>
            <button type="button" id="btnDoLogin" class="btn-primary" style="width:100%;margin-top:4px">登录并同步专属订阅</button>
          </div>
          <!-- 登录成功后的用户信息 -->
          <div id="loggedInWrap" style="display:none">
            <div class="user-info-row">
              <div class="user-badge" id="userAvatar">A</div>
              <div class="user-meta">
                <div style="display:flex;align-items:center;gap:6px">
                  <b id="userDisplayName">用户</b>
                  <span id="userPlanBadge" class="tag-sm tag-blue">套餐</span>
                </div>
                <span id="userServerHost" style="font-size:10px;color:var(--muted)"></span>
              </div>
              <button type="button" id="btnClientLogout" class="btn-ghost">退出</button>
            </div>
            <div class="sub-picker-row" id="subPickerWrap" style="margin-top:8px">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px">
                <label style="font-size:11px;color:var(--muted)">当前专属订阅:</label>
                <span id="subCountBadge" class="tag-sm tag-blue">1 个可用</span>
              </div>
              <select id="userSubSelect" class="sub-select"></select>
            </div>
          </div>
        </div>
      </section>

      <!-- 代理接管模式选择：仅提供系统代理与 TUN 接管选项；未选择即默认纯本地 55555 专线 -->
      <section class="card">
        <div class="card-hd" style="display:flex;justify-content:space-between;align-items:center;">
          <span data-i18n="mode">代理接管</span>
          <span style="font-size:10px;color:var(--muted)">未勾选即纯本地 55555</span>
        </div>
        <div class="mode-row">
          <label class="mode" data-mode="sysproxy">
            <input type="radio" name="mode" value="sysproxy" />
            <b data-i18n="modeSys">系统代理</b>
          </label>
          <label class="mode" data-mode="tun">
            <input type="radio" name="mode" value="tun" />
            <b>TUN</b>
          </label>
        </div>
        <p id="modeTip" class="muted" data-i18n="tipZero">未启用接管，仅 55555 端口就绪，指纹浏览器专用</p>
      </section>

      <!-- 状态指示条（紧凑精炼） -->
      <section class="status-bar">
        <div class="st-row">
          <span class="st-label" data-i18n="network">网络</span>
          <span id="stProbe" class="st-val">—</span>
        </div>
        <div class="st-row">
          <span class="st-label" data-i18n="mode">接管</span>
          <span id="stMode" class="st-val">纯本地 55555</span>
        </div>
        <div class="st-row">
          <span class="st-label" data-i18n="node">节点</span>
          <span id="stNode" class="st-val">—</span>
        </div>
        <div class="st-row">
          <span class="st-label" data-i18n="sni">伪装通道</span>
          <span id="stSNI" class="st-val">—</span>
        </div>
        <div class="st-row">
          <span class="st-label" data-i18n="latency">延迟</span>
          <span id="stRtt" class="st-val">—</span>
        </div>
        <div class="st-row">
          <span class="st-label" data-i18n="local">本地口</span>
          <span id="stListen" class="st-val">127.0.0.1:55555</span>
        </div>
      </section>

      <p id="msg" class="msg"></p>
    </div>

    <!-- 扫码弹层 -->
    <div id="scanSheet" class="sheet" hidden>
      <div class="sheet-card">
        <h2 data-i18n="scanTitle">导入订阅</h2>
        <p class="muted" data-i18n="scanSub">扫码或从相册选图</p>
        <video id="cam" playsinline muted></video>
        <canvas id="qrCanvas" hidden></canvas>
        <button type="button" id="btnCam" class="sheet-btn">
          <span data-i18n="openCam">打开相机</span>
          <small data-i18n="camHint">需相机权限 · Win / macOS / iOS</small>
        </button>
        <button type="button" id="btnAlbum" class="sheet-btn">
          <span data-i18n="album">从相册选图</span>
          <small data-i18n="albumHint">选择二维码截图</small>
        </button>
        <button type="button" id="btnScanCancel" class="sheet-cancel" data-i18n="cancel">取消</button>
      </div>
    </div>
    <input id="fileAlbum" type="file" accept="image/*" hidden />
    <script src="jsqr.js"></script>
    <script src="i18n.js"></script>
    <script src="app.js"></script>
  </body>
</html>
