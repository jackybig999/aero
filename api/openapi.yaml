openapi: 3.1.0
info:
  title: AERO Protocol & Platform REST API Contract
  version: 2.0.0
  description: >
    Official REST API and Subscription Contract for AERO VPN Platform, Midplatform Control Plane,
    and Edge Server Data Plane. Strictly adheres to GLOBAL MASTER RULES v1.0.0 (§7.1 Contract-First)
    and AERO P9 (Native AERO Subscription Only & Zero-Port URL Mandate).

servers:
  - url: https://{domain}
    description: Production Midplatform / Edge Node Gateway (Port 443 HTTPS only)
    variables:
      domain:
        default: edge.aero.internal
        description: Standard HTTPS Domain FQDN

paths:
  /sub/{param}:
    get:
      summary: Fetch Native AERO Subscription Configuration
      description: >
        Official AERO 2.0 Subscription endpoint. Strictly bans 3rd-party formats (Clash, sing-box).
        Param can be:
        1. 'superadmin' for Superadmin master node subscription
        2. '{username}{6-char-random-slug}' for individual user subscription
      parameters:
        - name: param
          in: path
          required: true
          schema:
            type: string
          description: Subscription token or user slug (e.g. superadmin or user123abc)
      responses:
        '200':
          description: Native AERO 2.0 JSON configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AEROPublicSubResponse'
        '403':
          description: Subscription disabled, expired, or quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User slug or admin token not found

  /healthz:
    get:
      summary: Liveness and Readiness Probe
      description: Production probe returning server healthy status.
      responses:
        '200':
          description: System healthy
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /metrics:
    get:
      summary: Prometheus Metrics
      description: Internal performance metrics (requests, latency, active connections).
      responses:
        '200':
          description: Prometheus formatted metric lines
          content:
            text/plain:
              schema:
                type: string

  /api/v1/auth/login/:
    post:
      summary: User / Admin Login
      description: Authenticate and issue session JWT / cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/UserInfo'
        '401':
          description: Invalid credentials

  /api/v1/user/subscription/:
    get:
      summary: Get Current User Subscription Info
      description: Returns subscription status, expiration, and traffic quota.
      responses:
        '200':
          description: Subscription details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSubscriptionInfo'

  /api/v1/aero/vps-options/:
    get:
      summary: List Configured VPS Options
      description: Returns list of available VPS nodes for deployment and management.
      responses:
        '200':
          description: List of VPS options
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VPSOption'

  /api/v1/aero/install/:
    post:
      summary: Deploy AERO Edge on Remote VPS
      description: Initiates installation task on specified VPS using 100% remote public source.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vps_id]
              properties:
                vps_id:
                  type: string
                domain:
                  type: string
      responses:
        '200':
          description: Installation task initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id:
                    type: string
                  status:
                    type: string

  /api/v1/aero/uninstall/:
    post:
      summary: Uninstall AERO Edge from Remote VPS
      description: Kills edge processes, purges config, and reverts VPS status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vps_id]
              properties:
                vps_id:
                  type: string
      responses:
        '200':
          description: Uninstall initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id:
                    type: string

components:
  schemas:
    AEROPublicSubResponse:
      type: object
      required: [version, endpoints]
      properties:
        version:
          type: string
          example: "aero/2.0"
        network_env:
          type: string
          example: "PUBLIC_INTERNET"
        server_dns:
          type: string
          example: "223.5.5.5"
        update_interval:
          type: integer
          example: 3600
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/AEROEndpointConfig'

    AEROEndpointConfig:
      type: object
      required: [node_id, host, port, protocol, token]
      properties:
        node_id:
          type: string
          example: "us-west-01"
        host:
          type: string
          example: "us01.example.com"
        port:
          type: integer
          example: 443
        protocol:
          type: string
          enum: [quic, h3, aero]
          example: "quic"
        token:
          type: string
        sni:
          type: string
          example: "us01.example.com"
        alpn:
          type: array
          items:
            type: string
          example: ["h3"]
        country:
          type: string
          example: "US"
        weight:
          type: integer
          example: 100

    UserInfo:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        role:
          type: string
          enum: [admin, user]
        created_at:
          type: string
          format: date-time

    UserSubscriptionInfo:
      type: object
      properties:
        slug:
          type: string
          example: "jacky123456"
        sub_url:
          type: string
          example: "https://myconsun.cc.cd/sub/jacky123456"
        status:
          type: string
          enum: [active, expired, disabled]
        expires_at:
          type: string
          format: date-time
        quota_bytes:
          type: integer
        used_bytes:
          type: integer

    VPSOption:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        ip:
          type: string
        domain:
          type: string
        installed:
          type: boolean
        status:
          type: string

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: "SUBSCRIPTION_EXPIRED"
        message:
          type: string
          example: "Your subscription has expired or exceeded data limits."
