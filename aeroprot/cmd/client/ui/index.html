<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c111c" />
    <title>AERO</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .nodes-card { margin-top: 10px; }
      .node-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #0a0f18;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .node-item:hover {
        border-color: var(--blue);
        background: #0f172a;
      }
      .node-item.active {
        border-color: var(--blue);
        background: #132238;
      }
      .node-info-col {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .node-name-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .node-name {
        font-size: 12px;
        font-weight: 600;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 220px;
      }
      .node-addr {
        font-size: 10px;
        color: var(--muted);
        font-family: monospace;
      }
      .node-badge-wrap {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }
      .badge-connected {
        font-size: 10px;
        font-weight: 700;
        color: var(--blue);
        background: rgba(59, 130, 246, 0.15);
        padding: 2px 6px;
        border-radius: 4px;
        border: 1px solid rgba(59, 130, 246, 0.3);
      }
      .latency-badge {
        font-size: 10px;
        font-weight: 700;
        padding: 2px 6px;
        border-radius: 4px;
        font-family: monospace;
      }
      .lat-green {
        background: rgba(34, 197, 94, 0.15);
        color: #22c55e;
        border: 1px solid rgba(34, 197, 94, 0.3);
      }
      .lat-yellow {
        background: rgba(234, 179, 8, 0.15);
        color: #eab308;
        border: 1px solid rgba(234, 179, 8, 0.3);
      }
      .lat-red {
        background: rgba(239, 68, 68, 0.15);
        color: #ef4444;
        border: 1px solid rgba(239, 68, 68, 0.3);
      }
      .lat-gray {
        background: rgba(139, 155, 180, 0.15);
        color: var(--muted);
        border: 1px solid rgba(139, 155, 180, 0.3);
      }
      @keyframes pulse-ring {
        0% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.03); opacity: 0.75; }
        100% { transform: scale(1); opacity: 1; }
      }
      .probing-pulse {
        animation: pulse-ring 1s infinite ease-in-out;
        pointer-events: none;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <div class="brand">
          <span class="logo">A</span>
          <div>
            <h1>AERO</h1>
            <p class="hint" data-i18n="tagline">本地口已开</p>
          </div>
        </div>
        <div class="lang-wrap">
          <button type="button" id="btnLang" class="lang-btn">简</button>
          <div id="langMenu" class="lang-menu" hidden>
            <button type="button" data-lang="zh-CN">简体中文</button>
            <button type="button" data-lang="zh-TW">繁體中文</button>
            <button type="button" data-lang="en">English</button>
          </div>
        </div>
      </header>

      <!-- 核心控制区：精巧 76px 状态呼吸旋钮 -->
      <div class="power-wrap">
        <button type="button" id="btnPower" class="power" aria-label="connect">
          <svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true">
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
              d="M12 3.5v8.2M8.1 6.2a7 7 0 1 0 7.8 0"
            />
          </svg>
        </button>
        <div id="stState" class="pill off" data-i18n="ready">就绪</div>
      </div>

      <!-- 常驻端口徽章：专供指纹浏览器/应用一键复制使用 -->
      <button type="button" id="btnDesktop" class="desktop">
        <span data-i18n="desktop">指纹浏览器专线</span>
        <b>127.0.0.1:55555</b>
        <span class="copy" data-i18n="copy">复制</span>
      </button>

      <!-- 订阅与账号中心：双通道切换 (专属订阅 / 中台账号登录) -->
      <section class="card" id="authCard">
        <div class="tab-hd">
          <button type="button" class="tab-btn active" id="tabSubManual">专属订阅链接</button>
          <button type="button" class="tab-btn" id="tabAuthLogin">中台账号登录</button>
        </div>

        <!-- 通道 1: 专属订阅链接输入 -->
        <div id="paneSubManual" class="tab-pane">
          <textarea id="subUrl" rows="2" spellcheck="false" placeholder="粘贴专属订阅链接 (https://.../sub/...)"></textarea>
          <div class="row" style="margin-top:6px">
            <button type="button" id="btnPaste" class="ghost" data-i18n="paste">📋 粘贴</button>
            <button type="button" id="btnScan" class="ghost" data-i18n="scan">📷 扫码</button>
            <button type="button" id="btnApplyManualSub" class="ghost" style="color:var(--blue);margin-left:auto">载入</button>
          </div>
        </div>

        <!-- 通道 2: 中台账号登录表单 -->
        <div id="paneAuthLogin" class="tab-pane" style="display:none">
          <div id="loginFormWrap">
            <div class="input-row">
              <span class="input-icon">🌐</span>
              <input type="text" id="loginServer" placeholder="中台地址 (如 https://myconsun.de5.net)" />
            </div>
            <div class="input-row">
              <span class="input-icon">👤</span>
              <input type="text" id="loginUsername" placeholder="中台用户名" />
            </div>
            <div class="input-row">
              <span class="input-icon">🔒</span>
              <input type="password" id="loginPassword" placeholder="登录密码" />
            </div>
            <button type="button" id="btnDoLogin" class="btn-primary" style="width:100%;margin-top:4px">登录并同步专属订阅</button>
          </div>
          <!-- 登录成功后的用户信息 -->
          <div id="loggedInWrap" style="display:none">
            <div class="user-info-row">
              <div class="user-badge" id="userAvatar">A</div>
              <div class="user-meta">
                <div style="display:flex;align-items:center;gap:6px">
                  <b id="userDisplayName">用户</b>
                  <span id="userPlanBadge" class="tag-sm tag-blue">套餐</span>
                </div>
                <span id="userServerHost" style="font-size:10px;color:var(--muted)"></span>
              </div>
              <button type="button" id="btnClientLogout" class="btn-ghost">退出</button>
            </div>
            <div class="sub-picker-row" id="subPickerWrap" style="margin-top:8px">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px">
                <label style="font-size:11px;color:var(--muted)">当前专属订阅:</label>
                <span id="subCountBadge" class="tag-sm tag-blue">1 个可用</span>
              </div>
              <select id="userSubSelect" class="sub-select"></select>
            </div>
          </div>
        </div>
      </section>

      <!-- 代理接管模式选择：仅提供 TUN 与系统代理两种接管选项；本地 55555 专线常驻 -->
      <section class="card">
        <div class="card-hd" style="display:flex;justify-content:space-between;align-items:center;">
          <span data-i18n="mode">接管模式</span>
          <span style="font-size:10px;color:var(--muted)">127.0.0.1:55555 本地常驻</span>
        </div>
        <div class="mode-row">
          <label class="mode selected" data-mode="tun">
            <input type="radio" name="mode" value="tun" checked />
            <b>TUN 全局模式</b>
          </label>
          <label class="mode" data-mode="sysproxy">
            <input type="radio" name="mode" value="sysproxy" />
            <b data-i18n="modeSys">系统代理模式</b>
          </label>
        </div>
        <p id="modeTip" class="muted">TUN 虚拟网卡驱动接管全局流量 (零改动系统注册表)</p>
      </section>

      <!-- 指标与规则条（高聚合精简） -->
      <section class="metrics-ribbon">
        <div class="metrics-row">
          <div class="metric-item">
            <span class="m-icon">🌐</span>
            <span class="m-label" data-i18n="node">节点</span>
            <b id="stNode" class="m-val">—</b>
          </div>
          <div class="metric-item">
            <span class="m-icon">📶</span>
            <span class="m-label" data-i18n="latency">延迟</span>
            <b id="stRtt" class="m-val">—</b>
            <button type="button" id="btnPing" class="badge-btn">⚡ 测速</button>
          </div>
        </div>
        <div class="metrics-row geodata-row">
          <div class="metric-item" style="width:100%;justify-content:space-between;">
            <div style="display:flex;align-items:center;gap:6px;">
              <span class="m-icon">🛡️</span>
              <span class="m-label">国内直连</span>
              <span id="geoRuleCount" class="geo-badge">8,420 条 (已就绪)</span>
            </div>
            <button type="button" id="btnSyncGeo" class="badge-btn ghost">🔄 同步</button>
          </div>
        </div>
      </section>

      <!-- 供应商线路看板：展示所有节点、实时测速、点击切线 -->
      <section class="card nodes-card" id="nodesCard">
        <div class="card-hd" style="display:flex;justify-content:space-between;align-items:center;">
          <div style="display:flex;align-items:center;gap:6px;">
            <span style="font-weight:700;">供应商线路</span>
            <span id="nodesCountBadge" class="tag-sm tag-blue" style="font-size:10px;">0 节点</span>
          </div>
          <button type="button" id="btnProbeAllNodes" class="badge-btn" style="cursor:pointer;padding:4px 8px;font-size:11px;font-weight:600;">⚡ 测速全部线路</button>
        </div>
        <div id="nodesList" class="nodes-list" style="margin-top:8px;display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto;padding-right:2px;">
          <div class="empty-nodes" style="color:var(--muted);font-size:11px;text-align:center;padding:12px 0;">暂无线路数据，请先载入订阅</div>
        </div>
      </section>

      <!-- 第三方 TUN 冲突交互卡片 (互斥提示与双动作引导) -->
      <div id="conflictBox" class="conflict-card" hidden>
        <div class="conflict-hd">
          <span class="conflict-icon">⚠️</span>
          <b id="conflictTitle" data-i18n="conflictTitle">检测到第三方 VPN 正在运行 TUN</b>
        </div>
        <p id="conflictDesc" class="conflict-desc"></p>
        <div class="conflict-actions">
          <button type="button" id="btnSwitchSysproxy" class="btn-conflict-primary" data-i18n="btnSwitchSysproxy">切到本地 55555 再连接</button>
          <button type="button" id="btnDismissConflict" class="btn-conflict-ghost" data-i18n="btnDismissConflict">先关掉对方的 TUN</button>
        </div>
      </div>

      <p id="msg" class="msg"></p>
    </div>

    <!-- 扫码弹层 -->
    <div id="scanSheet" class="sheet" hidden>
      <div class="sheet-card">
        <h2 data-i18n="scanTitle">导入订阅</h2>
        <p class="muted" data-i18n="scanSub">扫码或从相册选图</p>
        <video id="cam" playsinline muted></video>
        <canvas id="qrCanvas" hidden></canvas>
        <button type="button" id="btnCam" class="sheet-btn">
          <span data-i18n="openCam">打开相机</span>
          <small data-i18n="camHint">需相机权限 · Win / macOS / iOS</small>
        </button>
        <button type="button" id="btnAlbum" class="sheet-btn">
          <span data-i18n="album">从相册选图</span>
          <small data-i18n="albumHint">选择二维码截图</small>
        </button>
        <button type="button" id="btnScanCancel" class="sheet-cancel" data-i18n="cancel">取消</button>
      </div>
    </div>
    <input id="fileAlbum" type="file" accept="image/*" hidden />
    <script src="jsqr.js"></script>
    <script src="i18n.js"></script>
    <script src="app.js"></script>
  </body>
</html>
