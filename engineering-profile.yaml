language: go            # go | rust | go+rust
kind: service           # cli | library | service
persistence: file       # none | file | sqlite | server-db
network: inbound        # none | outbound | inbound
concurrency: in-process # none | in-process
frontend: embedded      # none | embedded | web | mobile（web：独立部署的浏览器前端）
components: multi       # single | multi，独立单元是否多于一个
tenancy: multi          # single | multi
replicas: 1             # 生产副本数
ai: none                # none | llm
pii: true               # 是否处理个人信息
